services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: restaurant
      POSTGRES_PASSWORD: restaurant
      POSTGRES_DB: restaurant_dev
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U restaurant -d restaurant_dev']
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://restaurant:restaurant@db:5432/restaurant_dev?schema=public
      JWT_ACCESS_SECRET: dev-access-secret-change-me-0123456789
      JWT_REFRESH_SECRET: dev-refresh-secret-change-me-0123456789
      CORS_ORIGINS: '*'
    ports:
      - '3000:3000'

volumes:
  pgdata:
